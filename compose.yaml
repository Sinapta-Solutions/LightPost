name: lightpost

services:
  app:
    build: .
    image: lightpost:local
    restart: unless-stopped
    env_file:
      - path: .env.container
        format: raw
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/lightpost.sqlite
    ports:
      - "127.0.0.1:4016:3000"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/session', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  data:
